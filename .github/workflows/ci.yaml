name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
