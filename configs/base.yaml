experiment:
  name: base
  output_dir: outputs
  tags: []
data:
  dataset: daic_woz
  root: data
  split_file: configs/data/official_daic_woz.json
  test_labels_file: data/full_test_split.csv
  preprocessing:
    lowercase: true
    normalize_whitespace: true
  max_qr_pairs: 128
  max_tokens: 128
  allowed_missing_transcript_ids: [458]
model:
  {}
training:
  seed: 0
  max_epochs: 100
  batch_size: 1
  gradient_accumulation_steps: 1
  precision: bf16
evaluation:
  metrics: [rmse, mae, accuracy, macro_f1, quadratic_weighted_kappa]
tracking:
  backend: disabled
  mode: disabled
