# Supplies the shared dataset, training, evaluation, and global tracking defaults for all experiments.
extends: tracking/global.yaml
experiment:
  name: base
  output_dir: outputs
  tags: []
data:
  dataset: daic_woz
  root: data
  split_file: configs/data/official_daic_woz.json
  test_labels_file: data/full_test_split.csv
  preprocessing:
    lowercase: true
    normalize_whitespace: true
  max_qr_pairs: 128
  max_tokens: 128
  allowed_missing_transcript_ids: [458]
  qr_cache:
    enabled: true
    directory: cache/qr_pairs
model:
  {}
training:
  seed: 0
  max_epochs: 100
  batch_size: 8
  gradient_accumulation_steps: 1
  precision: bf16
  deterministic: true
  gradient_clip_norm: 1.0
  optimizer:
    name: adamw
    adapted_encoder_peft_learning_rate: 1.0e-4
    semantic_projection_learning_rate: 3.0e-4
    qr_fusion_learning_rate: 3.0e-4
    interview_encoder_learning_rate: 3.0e-4
    heads_learning_rate: 3.0e-4
    weight_decay: 0.01
  scheduler:
    name: linear
    warmup_ratio: 0.1
  early_stopping:
    monitor: dev_rmse
    patience: 15
    min_delta: 0.0
evaluation:
  metrics: [rmse, mae, accuracy, macro_f1, quadratic_weighted_kappa]
