extends: ../../base.yaml
experiment:
  name: modern-dora-e5-transformer
  tags: [modern, dora, e5, transformer]
model:
  execution:
    qr_encoder_micro_batch_size: 4
    adapted_device: cuda:0
    semantic_device: cuda:1
  adapted_encoder:
    name: microsoft/deberta-v3-base
    method: dora
    revision: e4647970a4c145e8a616c83caeaec8493e8aaf17
    rank: 8
    alpha: 16
    dropout: 0.1
    pooling: masked_mean
    gradient_checkpointing: true
  semantic_encoder:
    name: intfloat/e5-base-v2
    revision: f52bf8ec8c7124536f0efb74aca902b2995e5bcd
    frozen: true
    pooling: masked_mean
    normalize: true
  qr_fusion:
    mode: feature_interaction
    hidden_size: 256
    dropout: 0.1
  branch_fusion:
    mode: vector_gate
    dropout: 0.1
    branch_dropout: 0.1
  interview_encoder:
    name: transformer
    layers: 2
    hidden_size: 256
    heads: 4
    feedforward_size: 512
    dropout: 0.2
    pooling: attention
  heads:
    regression_loss: huber
    huber_delta: 2.0
    ordinal_loss: corn
    ordinal_loss_weight: 0.5
    dropout: 0.2
training:
  max_epochs: 100
  precision: bf16
  optimizer:
    name: adamw
  scheduler:
    name: linear
  early_stopping:
    monitor: dev_rmse
    patience: 1
