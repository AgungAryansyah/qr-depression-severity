extends: ../../base.yaml
experiment:
  name: reproduction-warmstart-dual
  tags: [reproduction, warmstart]
model:
  adapted_encoder:
    name: roberta-base
    method: prefix
    revision: null
    prefix_length: 10
    pooling: masked_mean
  semantic_encoder:
    name: sentence-transformers/all-mpnet-base-v2
    revision: null
    frozen: true
    pooling: masked_mean
  qr_fusion:
    mode: legacy
  branch_fusion:
    mode: average
  interview_encoder:
    name: bilstm_attention
    attention: true
  heads:
    regression_loss: mse
training:
  max_epochs: 100
  batch_size: 1
  precision: bf16
  optimizer:
    name: adamw
  scheduler:
    name: linear
  early_stopping:
    monitor: dev_rmse
    patience: 15
